name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig build fmt

      - name: Run unit tests
        run: zig build test -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Run interactive and compatibility tests
        run: |
          for test_file in tests/*_test.py; do
            echo "== ${test_file}"
            python3 "${test_file}"
          done

      - name: Report binary sizes
        run: |
          zig build small -Dtarget=x86_64-linux -Dcpu=baseline
          {
            echo "| build | bytes |"
            echo "|---|---|"
            echo "| ReleaseFast | $(stat -c %s zig-out/bin/wsh) |"
            echo "| ReleaseSmall | $(stat -c %s zig-out/bin/wsh-small) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  mem-guard:
    name: Memory guard
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build with the checking allocator
        run: zig build -Doptimize=Debug -Dmem-guard=true -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Run the demo and the guard cases
        run: |
          zig-out/bin/wsh examples/demo.wsh > /dev/null 2> demo.err || true
          cat demo.err
          ! grep -q -e 'mem-guard' -e 'Double free' -e 'panic' demo.err
          bash tests/guard_cases.sh zig-out/bin/wsh

  guarded-suite:
    name: Test suite under the memory guard
    runs-on: ubuntu-24.04
    # The Debug build is slower, so timing-sensitive tests can fail. Read the
    # failures; make this job blocking when it is clean.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build with the checking allocator
        run: zig build -Doptimize=Debug -Dmem-guard=true -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Run every test file on the guarded build
        run: |
          status=0
          for test_file in tests/*_test.py; do
            echo "== ${test_file}"
            python3 "${test_file}" || status=1
          done
          exit "$status"
