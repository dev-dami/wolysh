name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig build fmt

      - name: Run unit tests
        run: zig build test -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Run interactive tests
        run: python3 tests/pty_test.py

      - name: Run shell compatibility tests
        run: python3 tests/shell_compat_test.py
