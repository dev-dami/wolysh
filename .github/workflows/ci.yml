name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig build fmt

      - name: Run unit tests
        run: zig build test -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Run interactive and compatibility tests
        run: |
          for test_file in tests/*_test.py; do
            echo "== ${test_file}"
            python3 "${test_file}"
          done

      - name: Report binary sizes
        run: |
          zig build small -Dtarget=x86_64-linux -Dcpu=baseline
          {
            echo "| build | bytes |"
            echo "|---|---|"
            echo "| ReleaseFast | $(stat -c %s zig-out/bin/wsh) |"
            echo "| ReleaseSmall | $(stat -c %s zig-out/bin/wsh-small) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  mem-guard:
    name: Memory guard
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build with the checking allocator
        run: zig build -Doptimize=Debug -Dmem-guard=true -Dtarget=x86_64-linux -Dcpu=baseline

      - name: Run scripts and fail on a leak or a bad free
        run: |
          wsh=zig-out/bin/wsh
          : > guard.log
          "$wsh" examples/demo.wsh > /dev/null 2>> guard.log || true
          for script in \
            'for i in 1 2 3; do x="$x$i"; done; echo "$x"' \
            'f() { local a=$1; echo "${a^^}"; }; f hello' \
            'arr=(a b c); arr+=(d); echo "${arr[@]:1:2}" "${#arr[@]}"' \
            'declare -A m; m[k]=v; unset "m[k]"; echo "${!m[@]}"' \
            'echo $(( 2**62 + 2**62 )) $(( -9223372036854775807 - 1 ))' \
            'x=$(printf "%s-" a b c); echo "${x%-}"' \
            'set -- one two three; shift; echo "$@"'; do
            "$wsh" -c "$script" > /dev/null 2>> guard.log || true
          done
          cat guard.log
          ! grep -q -e 'mem-guard' -e 'Double free' -e 'panic' guard.log
