<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
  <title id="title">wolysh performance relative to reference measurements</title>
  <desc id="description">A dark dumbbell plot shows each wolysh result as a percentage of Bash or ReleaseFast, with lower values better. Startup is 53 percent, loop time 13 percent, memory 17 percent, and ReleaseSmall binary size 64 percent of the reference.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #f2f2f2; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #e8e8e8; }
    .title { font-size: 29px; font-weight: 750; letter-spacing: -0.6px; }
    .subtitle { font-size: 13px; fill: #b3b3b3; }
    .meta { font-size: 10px; font-weight: 650; letter-spacing: 0.7px; fill: #a0a0a0; }
    .column { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #a6a6a6; }
    .tick { font-size: 10px; fill: #898989; }
    .row { fill: #111111; stroke: #292929; stroke-width: 1; }
    .metric { font-size: 13px; font-weight: 700; letter-spacing: 0.35px; }
    .detail { font-size: 11px; fill: #b0b0b0; }
    .wolysh-text { fill: #f2f2f2; }
    .connector { stroke: #5e5e5e; stroke-width: 2; }
    .point { fill: #f2f2f2; stroke: #000000; stroke-width: 3; }
    .point-label { font-size: 11px; font-weight: 750; fill: #f2f2f2; }
    .reference { fill: #000000; stroke: #b8b8b8; stroke-width: 2; }
    .guide { stroke: #505050; stroke-width: 1; stroke-dasharray: 3 5; }
    .change { font-size: 19px; font-weight: 750; fill: #f2f2f2; }
    .change-detail { font-size: 10px; fill: #a0a0a0; }
    .foot { font-size: 11px; fill: #898989; }
  </style>

  <rect width="960" height="570" fill="#000000" />

  <text class="eyebrow" x="28" y="31">WOLYSH / PERFORMANCE</text>
  <text class="title" x="28" y="67">The shell, measured.</text>
  <text class="subtitle" x="28" y="91">Dot position is the share of its reference result. Lower is better.</text>
  <rect x="681" y="24" width="251" height="30" rx="15" fill="#111111" stroke="#333333" />
  <circle cx="699" cy="39" r="4" fill="#f2f2f2" />
  <text class="meta" x="711" y="43">LOCAL RESULTS · SINGLE DEV MACHINE</text>

  <circle cx="704" cy="112" r="5" fill="#f2f2f2" />
  <text class="detail" x="716" y="116">wolysh result</text>
  <circle cx="824" cy="112" r="5" class="reference" />
  <text class="detail" x="836" y="116">reference · 100%</text>

  <text class="column" x="36" y="151">MEASUREMENT</text>
  <text class="column" x="390" y="151">RESULT AS % OF REFERENCE</text>
  <text class="column" x="866" y="151">CHANGE</text>
  <text class="tick" x="390" y="173" text-anchor="middle">0%</text>
  <text class="tick" x="497.5" y="173" text-anchor="middle">25%</text>
  <text class="tick" x="605" y="173" text-anchor="middle">50%</text>
  <text class="tick" x="712.5" y="173" text-anchor="middle">75%</text>
  <text class="tick" x="820" y="173" text-anchor="middle">100%</text>

  <line class="guide" x1="820" y1="184" x2="820" y2="506" />

  <g>
    <rect class="row" x="24" y="186" width="912" height="72" rx="10" />
    <text class="metric" x="42" y="214">STARTUP · 500 RUNS</text>
    <text class="detail" x="42" y="235"><tspan class="wolysh-text">wolysh</tspan> 1.14 ms  ·  Bash 2.16 ms</text>
    <line class="connector" x1="617" y1="222" x2="820" y2="222" />
    <circle class="point" cx="617" cy="222" r="8" />
    <text class="point-label" x="617" y="205" text-anchor="middle">53%</text>
    <circle class="reference" cx="820" cy="222" r="6" />
    <text class="change" x="866" y="218">−47%</text>
    <text class="change-detail" x="866" y="236">startup time</text>
  </g>

  <g>
    <rect class="row" x="24" y="266" width="912" height="72" rx="10" />
    <text class="metric" x="42" y="294">LOOP · 20,000 ITERATIONS</text>
    <text class="detail" x="42" y="315"><tspan class="wolysh-text">wolysh</tspan> 15 ms  ·  Bash 120 ms</text>
    <line class="connector" x1="444" y1="302" x2="820" y2="302" />
    <circle class="point" cx="444" cy="302" r="8" />
    <text class="point-label" x="444" y="285" text-anchor="middle">13%</text>
    <circle class="reference" cx="820" cy="302" r="6" />
    <text class="change" x="866" y="298">−88%</text>
    <text class="change-detail" x="866" y="316">loop time</text>
  </g>

  <g>
    <rect class="row" x="24" y="346" width="912" height="72" rx="10" />
    <text class="metric" x="42" y="374">INTERACTIVE IDLE MEMORY</text>
    <text class="detail" x="42" y="395"><tspan class="wolysh-text">wolysh</tspan> 0.7 MB  ·  Bash 4.2 MB</text>
    <line class="connector" x1="462" y1="382" x2="820" y2="382" />
    <circle class="point" cx="462" cy="382" r="8" />
    <text class="point-label" x="462" y="365" text-anchor="middle">17%</text>
    <circle class="reference" cx="820" cy="382" r="6" />
    <text class="change" x="866" y="378">−83%</text>
    <text class="change-detail" x="866" y="396">resident memory</text>
  </g>

  <g>
    <rect class="row" x="24" y="426" width="912" height="72" rx="10" />
    <text class="metric" x="42" y="454">BINARY SIZE</text>
    <text class="detail" x="42" y="475"><tspan class="wolysh-text">ReleaseSmall</tspan> 201 KB  ·  ReleaseFast 312 KB</text>
    <line class="connector" x1="667" y1="462" x2="820" y2="462" />
    <circle class="point" cx="667" cy="462" r="8" />
    <text class="point-label" x="667" y="445" text-anchor="middle">64%</text>
    <circle class="reference" cx="820" cy="462" r="6" />
    <text class="change" x="866" y="458">−36%</text>
    <text class="change-detail" x="866" y="476">binary size</text>
  </g>

  <text class="foot" x="24" y="539">One development machine; workload-specific measurements, not a standardized benchmark.</text>
</svg>
